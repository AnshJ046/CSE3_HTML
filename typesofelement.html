<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of elements</title>
</head>
<body>
    <!-- Block elements -->
     <div>Hello</div>
     <div>world</div>
    <header>Welcome to</header>
    <header>Html</header>

    <h1>hello</h1>
    <h1>world</h1>

    <!-- INLINE ELEMENTS -->
     <a href="http://www.google.com">google link</a>
     <br>
     <a href="http//www.icicbank.com">icic bank</a>
     <span>hello world</span>
     <b>hello ansh</b>
     <br>
     <i>Hello bro</i>
     <center>WELCOME</center>
     <br>
     <ul>
        <li>ansh</li>
        <li>anik</li>
     </ul>
     <hr>
     <ol>
        <li>mango</li>
        <li>
        grapes
        </li>
     </ol>
     <img src="/img.png" alt="loading error">
     


</body>
</html>
